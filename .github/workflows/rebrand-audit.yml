name: Rebrand Audit

on:
  pull_request:
    paths-ignore:
      - 'website/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory legacy product branding
        shell: bash
        run: |
          set -euo pipefail
          echo "=== legacy branding inventory ==="
          grep -RInE 'TL Agent|TL-Agent|tl-agent|TL_AGENT' .             --exclude-dir=.git             --exclude='*.sum'             --exclude='*.lock'             || true
