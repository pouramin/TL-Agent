name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            goos: windows
            goarch: amd64
            launcher: kilo-local-ui.exe
            kilo_asset: kilo-windows-x64.zip
            kilo_binary: kilo.exe
            kind: zip
          - name: linux-x64
            goos: linux
            goarch: amd64
            launcher: kilo-local-ui
            kilo_asset: kilo-linux-x64.tar.gz
            kilo_binary: kilo
            kind: tar
          - name: linux-arm64
            goos: linux
            goarch: arm64
            launcher: kilo-local-ui
            kilo_asset: kilo-linux-arm64.tar.gz
            kilo_binary: kilo
            kind: tar
          - name: macos-x64
            goos: darwin
            goarch: amd64
            launcher: kilo-local-ui
            kilo_asset: kilo-darwin-x64.zip
            kilo_binary: kilo
            kind: zip
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            launcher: kilo-local-ui
            kilo_asset: kilo-darwin-arm64.zip
            kilo_binary: kilo
            kind: zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        run: go test ./...
      - name: Build launcher
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p staging/package/bin staging/upstream
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "staging/package/${{ matrix.launcher }}" ./cmd/launcher
      - name: Download pinned Kilo runtime
        shell: bash
        run: |
          set -euo pipefail
          KILO_VERSION="$(tr -d '[:space:]' < KILO_VERSION)"
          URL="https://github.com/Kilo-Org/kilocode/releases/download/v${KILO_VERSION}/${{ matrix.kilo_asset }}"
          curl --fail --location --retry 3 "$URL" -o "staging/upstream/${{ matrix.kilo_asset }}"
          if [[ "${{ matrix.kind }}" == "zip" ]]; then
            unzip -q "staging/upstream/${{ matrix.kilo_asset }}" -d staging/upstream/extracted
          else
            mkdir -p staging/upstream/extracted
            tar -xzf "staging/upstream/${{ matrix.kilo_asset }}" -C staging/upstream/extracted
          fi
          KILO_BIN="$(find staging/upstream/extracted -type f -name '${{ matrix.kilo_binary }}' | head -n 1)"
          test -n "$KILO_BIN"
          cp "$KILO_BIN" "staging/package/bin/${{ matrix.kilo_binary }}"
          chmod +x "staging/package/${{ matrix.launcher }}" || true
          chmod +x "staging/package/bin/${{ matrix.kilo_binary }}" || true
          cp LICENSE THIRD_PARTY_NOTICES.md staging/package/
          mkdir -p staging/package/third_party
          cp third_party/KILO_LICENSE.txt staging/package/third_party/
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd staging/package && zip -qr "../../dist/kilo-local-ui-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" .)
          else
            tar -C staging/package -czf "dist/kilo-local-ui-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
