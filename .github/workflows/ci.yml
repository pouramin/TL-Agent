name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Verify browser JavaScript syntax
        run: |
          for file in cmd/launcher/web/*.js; do node --check "$file"; done
      - name: Verify npx quick launcher
        run: |
          node --check scripts/npx-launch.cjs
          npm pack --dry-run --ignore-scripts
      - name: Enforce Kilo API adapter boundary
        shell: bash
        run: |
          set -euo pipefail
          files=(cmd/launcher/web/core.js cmd/launcher/web/chat.js cmd/launcher/web/attachments.js cmd/launcher/web/attention.js cmd/launcher/web/app.js)
          if grep -nE 'K\.kilo|/kilo/(api|provider|session|agent|permission|question|global)|K\.request\([^)]*/kilo' "${files[@]}"; then
            echo "UI modules must access Kilo only through cmd/launcher/web/kilo-api.js" >&2
            exit 1
          fi
      - name: Verify Python test syntax
        run: |
          python3 -m py_compile \
            scripts/check-kilo-product-contract.py \
            scripts/check-kilo-project-routing.py \
            scripts/fake-openai-server.py \
            scripts/check-kilo-prompt-e2e.py
      - name: Cross-compile supported launchers
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/kilo-local-ui.exe ./cmd/launcher
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/kilo-local-ui-linux-x64 ./cmd/launcher
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/kilo-local-ui-linux-arm64 ./cmd/launcher
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /tmp/kilo-local-ui-darwin-x64 ./cmd/launcher
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/kilo-local-ui-darwin-arm64 ./cmd/launcher

  kilo-product-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build launcher and download pinned Kilo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/klu-contract/bin /tmp/klu-upstream
          go build -trimpath -o /tmp/klu-contract/kilo-local-ui ./cmd/launcher
          KILO_VERSION="$(tr -d '[:space:]' < KILO_VERSION)"
          ASSET="kilo-linux-x64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/Kilo-Org/kilocode/releases/download/v${KILO_VERSION}/${ASSET}" \
            -o "/tmp/klu-upstream/${ASSET}"
          tar -xzf "/tmp/klu-upstream/${ASSET}" -C /tmp/klu-upstream
          KILO_BIN="$(find /tmp/klu-upstream -type f -name kilo | head -n 1)"
          test -n "$KILO_BIN"
          cp "$KILO_BIN" /tmp/klu-contract/bin/kilo
          chmod +x /tmp/klu-contract/kilo-local-ui /tmp/klu-contract/bin/kilo
      - name: Run real-runtime product API contract test
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          START_DIR="$PWD"
          cd /tmp
          /tmp/klu-contract/kilo-local-ui --no-browser --project "$GITHUB_WORKSPACE" >"$LOG" 2>&1 &
          PID=$!
          cd "$START_DIR"
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            echo "--- launcher log ---"
            cat "$LOG"
          }
          trap cleanup EXIT

          LOCAL_URL=""
          for _ in $(seq 1 100); do
            LOCAL_URL="$(awk '/Local:/ {print $2; exit}' "$LOG" || true)"
            if [[ -n "$LOCAL_URL" ]] && curl --fail --silent "$LOCAL_URL/kilo/global/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          test -n "$LOCAL_URL"
          python3 scripts/check-kilo-project-routing.py "$LOCAL_URL"
          python3 scripts/check-kilo-product-contract.py "$LOCAL_URL"

  kilo-product-prompt-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build launcher and download pinned Kilo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/klu-e2e/bin /tmp/klu-upstream
          go build -trimpath -o /tmp/klu-e2e/kilo-local-ui ./cmd/launcher
          KILO_VERSION="$(tr -d '[:space:]' < KILO_VERSION)"
          ASSET="kilo-linux-x64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/Kilo-Org/kilocode/releases/download/v${KILO_VERSION}/${ASSET}" \
            -o "/tmp/klu-upstream/${ASSET}"
          tar -xzf "/tmp/klu-upstream/${ASSET}" -C /tmp/klu-upstream
          KILO_BIN="$(find /tmp/klu-upstream -type f -name kilo | head -n 1)"
          test -n "$KILO_BIN"
          cp "$KILO_BIN" /tmp/klu-e2e/bin/kilo
          chmod +x /tmp/klu-e2e/kilo-local-ui /tmp/klu-e2e/bin/kilo
      - name: Run product prompt and real write-tool E2E
        shell: bash
        run: |
          set -euo pipefail
          FAKE_LOG="$(mktemp)"
          LAUNCHER_LOG="$(mktemp)"
          PROJECT_DIR="/tmp/klu-e2e-project"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          FAKE_WRITE_PATH="$PROJECT_DIR/hello.txt" python3 scripts/fake-openai-server.py >"$FAKE_LOG" 2>&1 &
          FAKE_PID=$!
          LLM_URL=""
          for _ in $(seq 1 50); do
            LLM_URL="$(head -n 1 "$FAKE_LOG" || true)"
            [[ "$LLM_URL" == http://127.0.0.1:* ]] && break
            sleep 0.1
          done
          [[ "$LLM_URL" == http://127.0.0.1:* ]]

          # Mirror Kilo v7.6.2's own production test-provider fixture exactly:
          # singular `provider`, @ai-sdk/openai-compatible, options.baseURL.
          python3 - "$LLM_URL" "$PROJECT_DIR/opencode.json" <<'PY'
          import json, sys
          url, output = sys.argv[1], sys.argv[2]
          config = {
              "formatter": False,
              "lsp": False,
              "provider": {
                  "test": {
                      "name": "Test",
                      "id": "test",
                      "env": [],
                      "npm": "@ai-sdk/openai-compatible",
                      "models": {
                          "test-model": {
                              "id": "test-model",
                              "name": "Test Model",
                              "attachment": False,
                              "reasoning": False,
                              "temperature": False,
                              "tool_call": True,
                              "release_date": "2025-01-01",
                              "limit": {"context": 100000, "output": 10000},
                              "cost": {"input": 0, "output": 0},
                              "options": {}
                          }
                      },
                      "options": {"apiKey": "test-key", "baseURL": url}
                  }
              }
          }
          with open(output, "w", encoding="utf-8") as f:
              json.dump(config, f)
          PY

          unset KILO_CONFIG_CONTENT || true
          START_DIR="$PWD"
          cd /tmp
          /tmp/klu-e2e/kilo-local-ui --no-browser --project "$PROJECT_DIR" >"$LAUNCHER_LOG" 2>&1 &
          LAUNCHER_PID=$!
          cd "$START_DIR"

          cleanup() {
            kill "$LAUNCHER_PID" 2>/dev/null || true
            kill "$FAKE_PID" 2>/dev/null || true
            wait "$LAUNCHER_PID" 2>/dev/null || true
            wait "$FAKE_PID" 2>/dev/null || true
            echo "--- launcher log ---"
            cat "$LAUNCHER_LOG"
            echo "--- fake LLM log ---"
            cat "$FAKE_LOG"
            echo "--- project config ---"
            cat "$PROJECT_DIR/opencode.json"
            echo "--- project files ---"
            find "$PROJECT_DIR" -maxdepth 2 -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
          }
          trap cleanup EXIT

          LOCAL_URL=""
          for _ in $(seq 1 100); do
            LOCAL_URL="$(awk '/Local:/ {print $2; exit}' "$LAUNCHER_LOG" || true)"
            if [[ -n "$LOCAL_URL" ]] && curl --fail --silent "$LOCAL_URL/kilo/global/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          test -n "$LOCAL_URL"
          python3 scripts/check-kilo-project-routing.py "$LOCAL_URL"
          python3 scripts/check-kilo-prompt-e2e.py "$LOCAL_URL"
