name: Publish npm launcher

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: false

      - name: Build isolated npm package
        run: node packaging/npm/build.cjs

      - name: Verify package contents
        working-directory: packaging/npm/dist
        run: |
          set -euo pipefail
          node --check tl-agent.cjs
          npm pack --dry-run --ignore-scripts

      - name: Publish to npmjs
        working-directory: packaging/npm/dist
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published; nothing to do."
            exit 0
          fi

          # First publication can use a short-lived npm token stored as NPM_TOKEN.
          # After the package exists, configure npm Trusted Publishing for this
          # workflow and remove the secret; npm CLI will use GitHub OIDC instead.
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}" --location=user
          fi

          npm publish --access public
